# IlmIz — nginx: TLS'ni yakunlaydi va ilovaga uzatadi.
#
# Ilova 127.0.0.1:8000 da, faqat mahalliy interfeysda tinglaydi. Tashqi
# dunyo bilan faqat shu nginx gaplashadi.
#
# O'rnatish `deploy/README.md` da tasvirlangan.

# Sertifikat olinmaguncha 80-port ACME so'rovini o'tkazishi kerak.
server {
    listen 80;
    listen [::]:80;
    server_name ilmiz.uz www.ilmiz.uz;

    # Let's Encrypt tekshiruvi shu yerdan o'tadi.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://ilmiz.uz$request_uri;
    }
}

# www — asosiy domenga yo'naltiriladi. Ikkalasi ham javob bersa, qidiruv
# tizimlari uchun to'liq dublikat bo'lib qolardi.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.ilmiz.uz;

    ssl_certificate     /etc/letsencrypt/live/ilmiz.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ilmiz.uz/privkey.pem;

    return 301 https://ilmiz.uz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ilmiz.uz;

    ssl_certificate     /etc/letsencrypt/live/ilmiz.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ilmiz.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS faqat sayt barqaror ishlagach yoqilsin: bir marta yuborilgach
    # brauzer uni `max-age` tugaguncha eslab qoladi va HTTP'ga qaytish
    # imkoni qolmaydi.
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # Xavfsizlik sarlavhalari `nginx-ilmiz-headers.conf` da: nginx'da
    # location ichidagi `add_header` server darajasidagilarni BEKOR qiladi,
    # shuning uchun ular har location'da `include` bilan takrorlanadi.
    include /etc/nginx/snippets/ilmiz-headers.conf;

    # Baza gigabaytlarcha; javoblar ham katta bo'lishi mumkin.
    client_max_body_size 4m;
    gzip on;
    gzip_types application/json application/javascript text/css text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Vite fayl nomiga hash qo'yadi (`index-D2gf9qg7.js`), shuning uchun
    # ularni uzoq keshlash xavfsiz — yangi qurilishda nom o'zgaradi.
    location /assets/ {
        alias /opt/ilmiz/app/dist/assets/;
        access_log off;
        expires 1y;
        include /etc/nginx/snippets/ilmiz-headers.conf;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Kirish va admin: so'rovlar soni cheklangan (zona `nginx-ilmiz-ratelimit.conf`
    # da, http darajasida). Anonim `/start` cheksiz `oauth_states` yozardi,
    # admin tokenini brute-force qilishga ham to'siq yo'q edi.
    location ~ ^/api/(auth|admin)/ {
        limit_req zone=ilmiz_auth burst=20 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/ilmiz-headers.conf;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Qolgani ilovaga. `index.html`, sitemap va robots.txt ham shu yerdan
    # keladi: ular `ILMIZ_SITE_URL` ga qarab yasaladi, ya'ni nginx ularni
    # o'zi bermasligi kerak.
    location / {
        include /etc/nginx/snippets/ilmiz-headers.conf;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
