# IlmIz — xavfsizlik sarlavhalari. /etc/nginx/snippets/ilmiz-headers.conf
# ga nusxalanadi va har bir location'da `include` qilinadi (location
# ichidagi `add_header` server darajasidagilarni bekor qilgani uchun).
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# Admin panel cookie bilan ishlaydi — iframe'ga joylab clickjacking
# qilinmasin. Ikkalasi ham: eski brauzerlar X-Frame-Options'ni, yangilari
# CSP frame-ancestors'ni o'qiydi.
add_header X-Frame-Options DENY always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
