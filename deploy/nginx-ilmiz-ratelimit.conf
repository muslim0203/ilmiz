# IlmIz — so'rov cheklovi zonasi. /etc/nginx/conf.d/ilmiz-ratelimit.conf ga
# nusxalanadi (zona faqat http darajasida e'lon qilinadi; sites-available
# dagi server bloki ichida bo'lmaydi).
#
# 10 so'rov/daqiqa har IP uchun, `burst=20` bilan: oddiy foydalanuvchi
# kirish oqimida 3–4 so'rov yuboradi, admin panel bir sahifada 5–6 ta.
# Chegara oshsa 429 qaytadi.
limit_req_zone $binary_remote_addr zone=ilmiz_auth:10m rate=10r/m;
