name: IlmIz checks

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Do not interrupt an active deployment when another push arrives.
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: 'sqlite:///:memory:'
      ILMIZ_NOINDEX: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check tracked files for private data
        run: python deploy/check_repository.py
      - name: Install tested Python dependencies
        run: python -m pip install -r deploy/requirements-ovh-20260831.txt
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Backend tests
        run: python -W ignore::ResourceWarning -m unittest discover -s backend/tests -p 'test_*.py'
      - name: Harvester and deployment tests
        run: |
          python -m unittest harvester.test_oai_harvester
          python -m unittest discover -s deploy -p 'test_*.py'
      - name: Build frontend
        run: npm run build
      - name: Validate shell scripts
        run: |
          shopt -s nullglob
          for script in deploy/*.sh; do bash -n "$script"; done
      - name: Package code only
        run: python deploy/package_runtime.py .deploy-artifacts/ci
      - name: Retain tested runtime (no database or secrets)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ilmiz-runtime-${{ github.sha }}
          path: |
            .deploy-artifacts/ci/runtime.tar.gz
            .deploy-artifacts/ci/SHA256SUMS
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy private staging
    needs: verify
    if: >-
      github.repository == 'muslim0203/ilmiz' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.OVH_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: ovh-staging
    concurrency:
      group: ovh-staging-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ilmiz-runtime-${{ github.sha }}
          path: runtime
      - name: Deploy the verified archive through restricted SSH
        env:
          OVH_DEPLOY_HOST: ${{ secrets.OVH_DEPLOY_HOST }}
          OVH_DEPLOY_USER: ${{ secrets.OVH_DEPLOY_USER }}
          OVH_DEPLOY_KEY: ${{ secrets.OVH_DEPLOY_KEY }}
          OVH_KNOWN_HOSTS: ${{ secrets.OVH_KNOWN_HOSTS }}
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 deploy/ci_deploy.py runtime/runtime.tar.gz "$RELEASE_ID"
