<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Sarlavha, tavsif, kanonik havola va JSON-LD har bir manzil uchun
         serverda qo'yiladi (backend/app/services/seo.py). Bu yerdagilar —
         faqat server qobig'i ishlamagan holatdagi zaxira. -->
    <title>IlmIz — OAK jurnallari va ilmiy maqolalar indeksi</title>
    <meta
      name="description"
      content="O‘zbekiston OAK ro‘yxatidagi ilmiy jurnallar va maqolalarning ochiq indeksi."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- DOI havolalari maqola sahifasidan eng ko'p bosiladi. -->
    <link rel="dns-prefetch" href="https://doi.org" />
    <!-- Shrift: ilgari CSS ichidagi @import bilan kelardi — brauzer avval
         bizning CSS'ni, keyin googleapis CSS'ni, keyin woff2'ni ketma-ket
         yuklardi (render-blocking zanjir). preconnect + to'g'ridan-to'g'ri
         link bilan ikki bosqich parallel ketadi; faqat ishlatiladigan
         og'irliklar so'raladi. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <script>
      // Mavzu React yuklanmasdan oldin qo'llanadi — aks holda sahifa bir zumda oq yonadi.
      (function () {
        try {
          var stored = localStorage.getItem("ilmiz-theme");
          var dark =
            stored === "dark" ||
            ((!stored || stored === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (error) {
          /* localStorage yopiq bo'lsa, standart yorug' mavzu qoladi. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
