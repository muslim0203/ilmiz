<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
    <meta
      name="description"
      content="O‘zbekiston OAK jurnallari va ilmiy maqolalarining ochiq indeksi"
    />
    <title>IlmIz — OAK jurnallari va maqolalar indeksi</title>
    <script>
      // Mavzu React yuklanmasdan oldin qo'llanadi — aks holda sahifa bir zumda oq yonadi.
      (function () {
        try {
          var stored = localStorage.getItem("ilmiz-theme");
          var dark =
            stored === "dark" ||
            ((!stored || stored === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (error) {
          /* localStorage yopiq bo'lsa, standart yorug' mavzu qoladi. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
